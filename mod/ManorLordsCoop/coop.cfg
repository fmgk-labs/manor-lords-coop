# Manor Lords Co-op settings. Lines are "key = value". Lines starting with # are ignored.
# Nothing has to be set here. The mod starts idle and changes nothing in your solo games.
# You become the host from the title screen (Co-op > Host New Game / Host From Save),
# or a friend when you accept a Steam invite.

# To switch the mod off completely without removing it, remove the "#" from the next line:
# role = disabled

# How a player whose game differs from the host's, or a player who joins, is brought to the host's world.
# The HOST's setting decides. single (the default): only that player loads the host's save; nobody else is stopped.
# all: the game pauses and every player loads the save (the older way; the mod also falls back to it by itself
# when a single load does not help). To use the older way always, remove the "#" from the next line:
# resync = all

# One co-op copy per install: a second copy of the game started while the first still runs gets no co-op (it would
# share the first copy's files and disturb its session); its menu says so. Should that line ever show although no
# other copy runs, remove the "#" from the next line and tell us:
# guard = off

# The mod checks a game object it has kept (a building, a villager, an animal) against the game's own list before it
# uses it again, so that an object the game has removed is never touched. Should that check ever cause trouble,
# remove the "#" from the next line and tell us:
# keptguard = off

# Visit mode for every player: press the walk key (or the game's Explore button) to walk on the map; every other
# player sees you walking. Change the key in the game: Settings, Controls, "Walk (co-op visit mode)" (a second key
# can be set there too); the game keeps your choice. The next line only sets the first key used until you choose
# one there: a letter, B unless you set another (remove the "#").
# visit_key = B
# To switch visit mode for every player off on this copy, remove the "#" from the next line:
# visit = off
