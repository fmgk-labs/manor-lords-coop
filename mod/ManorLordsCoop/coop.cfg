# Manor Lords Co-op settings. Lines are "key = value". Lines starting with # are ignored.
# Nothing has to be set here. The mod starts idle and changes nothing in your solo games.
# You become the host from the title screen (Co-op > Host New Game / Host From Save),
# or a friend when you accept a Steam invite.

# To switch the mod off completely without removing it, remove the "#" from the next line:
# role = disabled

# How a player whose game differs from the host's, or a player who joins, is brought to the host's world.
# The HOST's setting decides. single (the default): only that player loads the host's save; nobody else is stopped.
# all: the game pauses and every player loads the save (the older way; the mod also falls back to it by itself
# when a single load does not help). To use the older way always, remove the "#" from the next line:
# resync = all
