name: Bug report
description: Something went wrong in a co-op game.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please read the [known issues](https://github.com/fmgk-labs/manor-lords-coop/blob/HEAD/docs/KNOWN_ISSUES.md) first: your bug may be there already.

        **Please do not report mod bugs to Slavic Magic or Hooded Horse.** Report them here.

        **How to report:** right after the problem, open the **Co-op** menu (title screen: the **Co-op** button;
        in a game: **Esc**, then **Co-op**) and press **Make Bug Report**. A folder opens with `report_<date>_<time>.zip`.
        Fill in this form and drag the zip into "Bug report zip" below.
        After a crash: start the game again and press **Make Bug Report** at the title screen. The crashed session is kept.

        **Privacy:** the zip has no Windows user name and no Steam names. **Do not attach the raw log files.**
        The game's crash records always contain your Windows user name: **never attach them here**. Send them privately (see SECURITY.md).

  - type: input
    id: game_version
    attributes:
      label: Game version
      description: Bottom right of the title screen.
      value: "0.8.117"
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      value: "0.2.2"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: I was
      options:
        - the host
        - a friend (joined by invite)
    validations:
      required: true

  - type: input
    id: players
    attributes:
      label: Players and PCs
      description: How many players, and were you on different PCs?
      placeholder: "2 players, 2 PCs"
    validations:
      required: true

  - type: input
    id: other_mods
    attributes:
      label: Other mods installed
      placeholder: "none"

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What I expected

  - type: input
    id: when
    attributes:
      label: When
      description: Date and time on your PC's clock. The logs use it. Game day and speed if you know them.
      placeholder: "2026-11-20 21:14, game day 310, speed 4"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What I did just before
      value: |
        1.
        2.
        3.

  - type: dropdown
    id: again
    attributes:
      label: Did it happen again?
      options:
        - once
        - sometimes
        - every time

  - type: dropdown
    id: crash
    attributes:
      label: Did the game close (crash)?
      options:
        - "no"
        - yes, on the host
        - yes, on a friend

  - type: dropdown
    id: syncing
    attributes:
      label: Did "Syncing with the host" show?
      options:
        - "no"
        - yes, once
        - yes, many times

  - type: textarea
    id: logs
    attributes:
      label: Bug report zip
      description: |
        Press **Make Bug Report** in the Co-op menu, then drag `report_<date>_<time>.zip` into this box.
        If no folder opened: the zip is in `Win64\ue4ss\Mods\ManorLordsCoop\link\reports\`
        (`Win64` is the folder with ManorLords-Win64-Shipping.exe).
        Zips from the host AND the friend help most.
        No Co-op button (the mod did not start)? Attach `Win64\ue4ss\UE4SS.log` instead, with your Windows user name replaced by `<me>`.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I attached the zip from Make Bug Report (not the raw log files), and did not attach crash records.
          required: true
